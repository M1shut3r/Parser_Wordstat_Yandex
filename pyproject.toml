[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "parser-wordstat-yandex"
version = "2.0.0"
description = "Desktop parser for Yandex Wordstat using Yandex Cloud API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "openpyxl>=3.1,<4",
    "customtkinter>=5.2,<6",
]


[project.scripts]
wordstat-parser = "wordstat_parser.__main__:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]