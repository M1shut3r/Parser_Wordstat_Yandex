[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "parser-wordstat-yandex"
version = "2.0.0"
description = "Desktop parser for Yandex Wordstat using Yandex Cloud API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "openpyxl>=3.1,<4",
    "customtkinter>=5.2,<6",
]


[project.scripts]
wordstat-parser = "wordstat_parser.__main__:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"